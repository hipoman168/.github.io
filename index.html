<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrueLife 真實人生｜人生選擇測驗</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="container">

    <header class="header">
        <h1>TrueLife 真實人生</h1>
        <p>每一個選擇，都定義真正的你。</p>
    </header>

    <section class="progress-section" id="progress-section">

        <div class="progress-text">
            <span id="current-question">1</span>
            /
            <span id="total-question">31</span>
        </div>

        <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
        </div>

    </section>

    <section id="question-container">

        <h2 id="question-title">
            題目載入中……
        </h2>

        <p id="question-text">
            請稍候……
        </p>

        <div class="button-group">

            <button
                id="option-a"
                class="choice-btn"
                type="button">
                A
            </button>

            <button
                id="option-b"
                class="choice-btn"
                type="button">
                B
            </button>

        </div>

    </section>

    <section id="result-container" hidden>

        <div class="result-heading">
            <p class="result-kicker">TrueLife Analysis</p>
            <h1>你的人生選擇輪廓</h1>
            <p>
                這不是人格定型，而是你在這 31 個人生情境中，
                所呈現出的價值排序與決策傾向。
            </p>
        </div>

        <div class="result-summary-card">
            <span>你的核心傾向</span>
            <h2 id="result-type">分析中……</h2>
            <p id="result-summary"></p>
        </div>

        <div class="chart-card">
            <h2>六維價值雷達圖</h2>

            <div class="chart-wrapper">
                <canvas id="result-chart"></canvas>
            </div>
        </div>

        <div class="dimension-section">
            <h2>六項傾向解析</h2>
            <div id="dimension-results" class="dimension-results"></div>
        </div>

        <div class="comment-card">
            <h2>TrueLife 綜合評論</h2>
            <p id="result-comment"></p>
        </div>

        <div class="result-notice">
            本結果只反映你在本次情境中的選擇，
            不代表永久人格，也不構成心理、醫療、法律或財務建議。
        </div>

        <div class="result-actions">

            <button
                id="restart-button"
                class="primary-button"
                type="button">
                重新測驗
            </button>

            <a href="index.html" class="secondary-link">
                返回首頁
            </a>

        </div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="js/test.js"></script>

</body>
</html>
