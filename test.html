<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TrueLife 真實人生——每一個選擇，都定義真正的你。">
  <title>TrueLife 真實人生｜人生選擇測驗</title>
  <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html" aria-label="返回 TrueLife 首頁">
              </a>
    </div>
  </header>

  <main class="test-page">
    <section id="progress-section" class="progress-section" aria-label="測驗進度">
      <div class="container">
        <p class="progress-information">第 <strong id="current-question">1</strong> / <strong id="total-question">31</strong> 題</p>
        <div id="progress-fill" hidden></div>
      </div>
    </section>

    <section id="question-container" class="question-section">
      <div class="container">
        <article class="question-card">
          <p class="question-label">人生情境</p>
          <h1 id="question-title">題目載入中</h1>
          <p id="question-text">正在讀取題目……</p>

          <div class="option-list">
            <button id="option-a" class="option-button" type="button">A</button>
            <button id="option-b" class="option-button" type="button">B</button>
          </div>
        </article>
      </div>
    </section>

    <section id="result-container" class="result-section" hidden>
      <div class="container">
        <article class="result-hero-card">
          <p class="result-label">你的價值傾向</p>
          <h2 id="result-type">分析中……</h2>
          <p id="result-summary">正在整理你的選擇……</p>
        </article>

        <section class="chart-section">
          <div class="section-heading">
            <p class="eyebrow">Six Dimensions</p>
            <h2>六維價值分析</h2>
          </div>
          <div class="chart-container">
            <canvas id="result-chart" aria-label="六維價值雷達圖" role="img"></canvas>
          </div>
        </section>

        <section class="dimension-section">
          <div class="section-heading">
            <p class="eyebrow">Detailed Results</p>
            <h2>六項分析結果</h2>
          </div>
          <div id="dimension-results" class="dimension-results"></div>
        </section>

        <section class="comment-section">
          <article class="comment-card">
            <p class="eyebrow">TrueLife Comment</p>
            <h2>綜合分析</h2>
            <p id="result-comment">正在產生分析內容……</p>
          </article>
        </section>

        <div class="result-actions">
          <button id="restart-button" class="primary-button" type="button">重新測驗</button>
          <a class="secondary-button" href="index.html">返回首頁</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>TrueLife 真實人生</p>
      <p>本測驗為情境式價值分析，不是臨床心理測驗或醫療診斷。</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.min.js"></script>
  <script src="js/test.js?v=5"></script>
</body>
</html>
